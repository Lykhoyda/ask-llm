# Throwaway local registry for the Node 20/26 global-install smoke (ADR-119).
# @ask-llm/mcp's freshly-bumped sibling ranges may not exist on npmjs yet at PR
# time, so we publish all seven public tarballs here before install smoke tests.
storage: /tmp/verdaccio-storage
auth:
  htpasswd:
    file: /tmp/verdaccio-htpasswd
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
packages:
  '@ask-llm/*':
    access: $all
    publish: $all
    # NO proxy: the seven @ask-llm/* tarballs published locally must always win —
    # at PR time their versions may equal npmjs versions (old broken builds)
    # or be bumped versions that don't exist upstream yet (ADR-119 smoke).
  '**':
    access: $all
    publish: $all
    proxy: npmjs
log: { type: stdout, format: pretty, level: warn }
