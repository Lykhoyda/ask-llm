name: Release

# Driven by changesets/action (ADR-076). Two modes per main-branch push:
#   1. Pending changesets exist  → opens/updates a "chore: version packages" PR
#   2. The push WAS that version-packages PR merging → publishes to npm, MCP Registry, unified Release, then package tags
on:
  push:
    branches: ["main"]
  # Manual dispatch for dry-runs against feature branches and for re-running
  # publishes after a workflow-side hotfix. Manual main-branch runs expose only
  # explicit, opt-in maintenance operations.
  workflow_dispatch:
    inputs:
      retry_registry_publish:
        description: Verify/repair MCP Registry, unified release, and package tags without npm publication
        required: false
        type: boolean
        default: false
      deprecate_legacy_packages:
        description: Deprecate the six package names replaced by the @ask-llm scope
        required: false
        type: boolean
        default: false

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write       # changesets/action commits version bumps; explicit package tags + unified release write refs
  pull-requests: write  # changesets/action opens the Version Packages PR
  issues: write         # failure reporter opens/comments on release-broken issues
  id-token: write       # OIDC for mcp-publisher (no token required)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # changesets/action needs full history to compute changed packages and write changelogs
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn lint
      - run: yarn test

      # Preflight gate (ADR-107, rules extended by ADR-119): statically assert no
      # publishable manifest carries `workspace:` deps, bundledDependencies, or
      # prepack/postpack hooks. Since ADR-119 @ask-llm/shared is INLINED into each
      # MCP's dist/ by tsdown (no bundling, no pack-time rewrite), so what's in source
      # is exactly what npm publishes. History: ADR-052 (npm 9 EUNSUPPORTEDPROTOCOL),
      # ADR-106/107 (2026-05-27 broken-release incident), #115 (npm 11 global install).
      - name: Preflight — assert no workspace:* in published manifests
        run: node scripts/preflight-no-workspace-protocol.mjs

      - name: Verify npm authorization for @ask-llm/plugin without publishing
        if: github.event_name != 'workflow_dispatch' || inputs.retry_registry_publish != true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          user=$(npm whoami)
          role=$(npm org ls ask-llm --json | jq -r --arg user "$user" '.[$user] // empty')
          case "$role" in
            owner|admin|developer) ;;
            *) echo "npm user $user lacks an @ask-llm organization publish role (reported: ${role:-none})"; exit 1 ;;
          esac
          # A missing package is the expected first-release state. If it already
          # exists, additionally require collaborator write permission. No
          # disposable version is ever published for this check.
          if npm view @ask-llm/plugin version --json >/tmp/plugin-version.json 2>/tmp/plugin-view.err; then
            permission=$(npm access list collaborators @ask-llm/plugin --json | jq -r --arg user "$user" '.[$user] // empty')
            case "$permission" in read-write|write) ;; *) echo "npm user $user lacks write access to @ask-llm/plugin"; exit 1 ;; esac
          elif ! grep -Eq 'E404|Not Found' /tmp/plugin-view.err; then
            cat /tmp/plugin-view.err; exit 1
          fi
          echo "Verified npm authorization for @ask-llm/plugin as $user ($role); no version published."

      # When pending changesets exist on main: opens/updates the Version Packages PR.
      # When this push IS the merged Version Packages PR: runs `yarn changeset:publish`
      # which builds + publishes any packages whose version is ahead of the registry.
      # Since ADR-119 there are NO pack-time lifecycle hooks — tsdown inlines
      # @ask-llm/shared at build time and manifests publish as-is.
      - name: Create Release PR or Publish
        # A registry-recovery dispatch must not re-enter npm publication. The
        # selective Registry helper below verifies and repairs published versions.
        if: github.event_name != 'workflow_dispatch' || inputs.retry_registry_publish != true
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: yarn changeset:version
          publish-script: yarn changeset:publish
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          create-github-releases: false   # we create one unified GitHub Release below, not per-package
          push-git-tags: false            # ADR-151 helper exclusively manages remote package source tags
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      # Scoped packages default to restricted visibility. Keep this explicit even
      # though every manifest requests public access; a publish can otherwise be
      # accepted by npm but remain invisible to unauthenticated installs.
      - name: Ensure Ask LLM packages are public on npm
        if: steps.changesets.outputs.published == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          for pkg in \
            @ask-llm/gemini-mcp \
            @ask-llm/codex-mcp \
            @ask-llm/claude-mcp \
            @ask-llm/grok-mcp \
            @ask-llm/ollama-mcp \
            @ask-llm/antigravity-mcp \
            @ask-llm/mcp \
            @ask-llm/plugin; do
            npm access set status=public "$pkg"
            test "$(npm access get status "$pkg" --json | jq -r --arg pkg "$pkg" '.[$pkg]')" = "public"
          done

      - name: Deprecate legacy npm package names
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deprecate_legacy_packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          failed=0
          npm deprecate "ask-gemini-mcp@*" "Moved to @ask-llm/gemini-mcp. The ask-gemini-mcp executable name is unchanged." || failed=1
          npm deprecate "ask-codex-mcp@*" "Moved to @ask-llm/codex-mcp. The ask-codex-mcp executable name is unchanged." || failed=1
          npm deprecate "@anton-lykhoyda/ask-claude-mcp@*" "Moved to @ask-llm/claude-mcp. The ask-claude-mcp executable name is unchanged." || failed=1
          npm deprecate "ask-ollama-mcp@*" "Moved to @ask-llm/ollama-mcp. The ask-ollama-mcp executable name is unchanged." || failed=1
          npm deprecate "ask-antigravity-mcp@*" "Moved to @ask-llm/antigravity-mcp. The ask-antigravity-mcp executable name is unchanged." || failed=1
          npm deprecate "ask-llm-mcp@*" "Moved to @ask-llm/mcp. The ask-llm-mcp executable name is unchanged." || failed=1
          exit "$failed"

      # Registry steps run after a real npm publish or an explicit manual retry.
      # Ordinary main pushes with no published versions still skip them.
      - name: Install mcp-publisher
        if: steps.changesets.outputs.published == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.retry_registry_publish)
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}" \
            --output "$archive"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" mcp-publisher
          rm "$archive"
          ./mcp-publisher --help >/dev/null

      # server.json + marketplace.json track the same versions as package.json but live in
      # separate files for the MCP Registry's input schema. Sync them after changesets'
      # version bump so the Registry publish picks up the freshly-bumped numbers.
      - name: Sync versions from package.json to server.json and marketplace.json
        if: steps.changesets.outputs.published == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.retry_registry_publish)
        run: |
          for entry in "gemini-mcp:packages/gemini-mcp/server.json" "codex-mcp:packages/codex-mcp/server.json" "claude-mcp:packages/claude-mcp/server.json" "grok-mcp:packages/grok-mcp/server.json" "ollama-mcp:packages/ollama-mcp/server.json" "antigravity-mcp:packages/antigravity-mcp/server.json" "llm-mcp:packages/llm-mcp/server.json"; do
            pkg="${entry%%:*}"
            file="${entry#*:}"
            PKG_VERSION=$(node -p "require('./packages/$pkg/package.json').version")
            jq --arg v "$PKG_VERSION" '(.version = $v) | (.packages[0].version = $v)' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
          done
          PLUGIN_VERSION=$(node -p "require('./packages/claude-plugin/package.json').version")
          jq --arg v "$PLUGIN_VERSION" '(.plugins[0].version = $v)' .claude-plugin/marketplace.json > .claude-plugin/marketplace.json.tmp && mv .claude-plugin/marketplace.json.tmp .claude-plugin/marketplace.json

      # The Registry rejects duplicate versions. Verify exact existing records,
      # publish only missing versions, and keep trying independent missing servers
      # so one real failure cannot hide another publication gap (ADR-139).
      - name: Publish missing servers to MCP Registry
        if: steps.changesets.outputs.published == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.retry_registry_publish)
        env:
          MCP_PUBLISHER_PATH: ./mcp-publisher
        run: >-
          node scripts/publish-mcp-registry.mjs
          packages/gemini-mcp/server.json
          packages/codex-mcp/server.json
          packages/claude-mcp/server.json
          packages/grok-mcp/server.json
          packages/ollama-mcp/server.json
          packages/antigravity-mcp/server.json
          packages/llm-mcp/server.json

      # Unified GitHub Release tagged at gemini's version (legacy convention from when this
      # was a fork of gemini-mcp-tool). It remains the single human-facing GitHub Release,
      # alongside remote per-package source tags used for package-level audit/diff links.
      - name: Get gemini version for unified release tag
        if: steps.changesets.outputs.published == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.retry_registry_publish)
        id: gemini_version
        run: echo "version=$(node -p "require('./packages/gemini-mcp/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create or verify unified GitHub Release
        if: steps.changesets.outputs.published == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.retry_registry_publish)
        env:
          GEMINI_VERSION: ${{ steps.gemini_version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${GEMINI_VERSION}"
          TAG_TARGET=$(git log -G "^[[:space:]]*\"version\": \"${GEMINI_VERSION}\"" -1 --format=%H -- packages/gemini-mcp/package.json)
          test -n "$TAG_TARGET"
          # A recovery may follow a partially-created tag or release. Verify the
          # existing tag target, create only the missing object, and never retag.
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            test "$(git rev-list -n 1 "$TAG")" = "$TAG_TARGET"
          else
            git tag "$TAG" "$TAG_TARGET"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Verified existing unified release $TAG at $TAG_TARGET"
          else
            gh release create "$TAG" --generate-notes --title "$TAG"
          fi

      # changesets/action creates package tags only in the runner when
      # createGithubReleases is false. Preserve the intended remote tag contract
      # explicitly, including on selective Registry/release recovery (ADR-151).
      # Runs after the unified release so a tag failure cannot block unified
      # release creation or verification; the helper is idempotent on rerun.
      - name: Create or verify per-package Git tags
        if: steps.changesets.outputs.published == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.retry_registry_publish)
        run: node scripts/create-or-verify-package-tags.mjs --verify-npm-git-head

      # Loud-on-failure: open a tracking issue (or comment on an existing one)
      # when any main-branch release step fails. Lived-experience trigger: PR #112's release
      # run sat with a red X for 5 days without anyone noticing because there
      # was no notification channel. A fresh issue with a label appears in
      # everyone's inbox.
      #
      # Safety note: this step uses `actions/github-script` with the `github`
      # octokit (no shell-evaluation of user input). All `context.*` values
      # (sha, runId, serverUrl, repo) are GitHub-runtime trusted; nothing from
      # an external PR body, commit message, or issue title is interpolated.
      - name: Open tracking issue on release failure
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const sha7 = context.sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // Don't spam: comment on an existing open release-broken issue instead of opening N.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "release-broken",
              per_page: 5,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Another release run failed: ${runUrl} (commit ${sha7})`,
              });
              return;
            }
            const body = [
              `The main-branch release workflow failed.`,
              ``,
              `**Run:** ${runUrl}`,
              `**Commit:** ${context.sha}`,
              ``,
              `Likely causes:`,
              `- npm authentication or package permission failure (only when the first failed step/log says npm returned an authentication or authorization error)`,
              `- Pinned mcp-publisher download or checksum verification failed`,
              `- MCP Registry OIDC authentication, manifest validation, exact-record verification, or publication failed`,
              `- Per-package Git tag history, npm gitHead, or remote-ref verification failed`,
              `- npm, GitHub, or MCP Registry outage`,
              ``,
              `**Fix path:**`,
              `1. Open the run above and identify the first failed step; do not infer NODE_AUTH_TOKEN failure from this issue template.`,
              `2. Check npm and MCP Registry state before retrying because npm publication may have succeeded before a later Registry failure.`,
              `3. Correct the reported auth, validation, mismatch, or service failure. Registry retries verify existing exact versions and publish only missing versions.`,
              `4. Retry Registry/release recovery on main with retry_registry_publish=true; this path does not re-enter npm publication and also creates or verifies package tags.`,
              `5. Close this issue only after the recovery run is green and all expected npm, Registry, package-tag, and unified-release versions are externally verified.`,
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Release workflow failed on ${sha7} — publish blocked`,
              body,
              labels: ["release-broken", "urgent"],
            });
