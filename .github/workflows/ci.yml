    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      with:
        fetch-depth: 0
    - name: Use Node.js 22.x
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: 22.x
    - run: corepack enable
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: test-setup-22.x-windows-latest
    - name: Restore platform setup
      run: tar -xzf test-setup.tgz
    - name: Run test batch ${{ matrix.batch }}/5
      run: yarn test:batch "${{ matrix.batch }}/5"
    - name: Record successful batch
      run: node -e "require('node:fs').writeFileSync('batch-${{ matrix.batch }}', '')"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: test-result-22.x-windows-latest-${{ matrix.batch }}
        path: batch-${{ matrix.batch }}
        retention-days: 1

  test-node22-windows:
    name: test (22.x, windows-latest)
    needs: test-batches-node22-windows
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
