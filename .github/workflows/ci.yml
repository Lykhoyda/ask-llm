        done

  test-setup-node22-windows:
    name: test setup (22.x, windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
