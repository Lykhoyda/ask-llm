name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Cap each matrix leg so a hung runner fails fast instead of stalling up to the
    # 6h default. Normal build+lint+test is <2m; #155 hit a 22.x runner that hung
    # ~12m while 20.x passed the same commit in 77s. 10m leaves generous headroom.
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v6
      with:
        # Full history: the ADR-119 shared-changeset guard diffs against the PR base
        # (git diff origin/<base>...HEAD needs the merge-base; a shallow clone has neither).
        fetch-depth: 0

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}

    - name: Enable Corepack
      run: corepack enable

    - name: Install dependencies
      run: yarn install --immutable

    - name: Build
      run: yarn build

    - name: Lint
      run: yarn lint

    - name: Run tests
      run: yarn test

    - name: Guard — shared changes must changeset all five MCPs (ADR-119)
      if: github.event_name == 'pull_request'
      run: node scripts/check-shared-changeset.mjs
