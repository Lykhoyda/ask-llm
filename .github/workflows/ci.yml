    - run: corepack enable
    - name: Install dependencies
      run: yarn install --immutable
    - name: Build
      run: yarn build
    - name: Lint
      run: yarn lint
    - name: Guard — shared changes must changeset all six MCPs (ADR-119)
      if: github.event_name == 'pull_request'
      run: node scripts/check-shared-changeset.mjs
    - name: Archive platform setup
      run: tar -czf test-setup.tgz node_modules packages .yarn/install-state.gz
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: test-setup-22.x-windows-latest
        path: test-setup.tgz
        retention-days: 1

  test-batches-node22-windows:
    name: test batch ${{ matrix.batch }}/5 (22.x, windows-latest)
    needs: test-setup-node22-windows
    if: always()
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
